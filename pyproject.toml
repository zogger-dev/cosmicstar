[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmicstar"
version = "0.1.0"
description = "StarCraft II AlphaStar Implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "absl-py",
    "black",
    "mpyq",
    "numpy",
    "pysc2",
    "requests",
    "s2protocol",
    "sc2reader",
    "torch",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
